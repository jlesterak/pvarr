version: '3.8'

services:
  pvarr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pvarr
    restart: unless-stopped
    ports:
      - "8999:8999"
    environment:
      - HOST=0.0.0.0
      - PORT=8999
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - PLEX_URL=${PLEX_URL:-}
      - PLEX_TOKEN=${PLEX_TOKEN:-}
      - EMBY_URL=${EMBY_URL:-}
      - EMBY_API_KEY=${EMBY_API_KEY:-}
    volumes:
      - ./config:/config
      - ./recordings:/recordings
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8999/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
