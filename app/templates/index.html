<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PVArr - Personal Video Recorder</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.ico">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            arr: {
              blue: '#0084ff',
              dark: '#1e293b',
              sidebar: '#0f172a',
              card: '#1e293b',
              accent: '#38bdf8',
            }
          }
        }
      }
    }
  </script>

  <!-- Alpine.js CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    body {
      background-color: #0b1120;
      color: #f1f5f9;
    }
    .arr-navbar {
      background: #0f172a;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .arr-card {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .arr-input {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .arr-input:focus {
      border-color: #0084ff;
      outline: none;
      box-shadow: 0 0 10px rgba(0, 132, 255, 0.3);
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
  </style>
</head>
<body class="font-sans min-h-screen flex flex-col text-slate-100" x-data="dashboardApp()">

  <!-- Top *Arr Header Bar -->
  <header class="arr-navbar sticky top-0 z-40 px-6 py-3 shadow-md">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-4">
        <!-- Logo -->
        <div class="w-9 h-9 rounded-lg bg-arr-blue flex items-center justify-center font-black text-xl text-white shadow-lg shadow-arr-blue/30">
          P
        </div>
        <div class="flex items-baseline space-x-2">
          <span class="text-xl font-bold tracking-tight text-white">PV<span class="text-arr-accent">Arr</span></span>
          <span class="text-xs font-semibold px-2 py-0.5 rounded bg-arr-blue/20 text-arr-accent border border-arr-blue/30">v1.0.0</span>
        </div>
      </div>

      <!-- Header Action Buttons -->
      <div class="flex items-center space-x-4">
        <div class="px-3 py-1 rounded-md text-xs font-medium flex items-center space-x-2 bg-slate-800 border border-slate-700">
          <span class="w-2 h-2 rounded-full" :class="activeSessions.length > 0 ? 'bg-emerald-400 animate-pulse' : 'bg-slate-500'"></span>
          <span x-text="activeSessions.length > 0 ? activeSessions.length + ' Active Stream(s)' : 'System Idle'"></span>
        </div>

        <button @click="openNewModal = true" class="bg-arr-blue hover:bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-md shadow-arr-blue/20 transition flex items-center space-x-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          <span>Add Recording</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Sub-header Navigation Tabs -->
  <div class="bg-slate-900/80 border-b border-slate-800 px-6 py-2">
    <div class="max-w-7xl mx-auto flex space-x-6 text-sm font-medium text-slate-400">
      <button @click="activeTab = 'active'" :class="activeTab === 'active' ? 'text-arr-accent border-b-2 border-arr-blue pb-1 font-semibold' : 'hover:text-slate-200 pb-1'">
        Live Recorders (<span x-text="activeSessions.length"></span>)
      </button>
      <button @click="activeTab = 'library'" :class="activeTab === 'library' ? 'text-arr-accent border-b-2 border-arr-blue pb-1 font-semibold' : 'hover:text-slate-200 pb-1'">
        Media Library (<span x-text="libraryFiles.length"></span>)
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-6 py-6 flex-1 w-full space-y-6">

    <!-- TAB 1: Active Recorders -->
    <div x-show="activeTab === 'active'" class="space-y-6">
      <template x-if="activeSessions.length === 0">
        <div class="arr-card rounded-xl p-12 text-center space-y-4">
          <div class="w-12 h-12 rounded-full bg-slate-800 text-slate-400 mx-auto flex items-center justify-center">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
          </div>
          <h3 class="text-base font-semibold text-slate-200">No active stream recordings</h3>
          <p class="text-slate-400 text-xs">Add a new stream candidate URL to begin recording with automatic failover protection.</p>
          <button @click="openNewModal = true" class="text-arr-accent hover:underline text-xs font-semibold">Start a new recording &rarr;</button>
        </div>
      </template>

      <div class="grid grid-cols-1 gap-6">
        <template x-for="session in activeSessions" :key="session.id">
          <div class="arr-card rounded-xl p-6 space-y-5 border border-slate-700/60 shadow-lg">
            
            <div class="flex items-start justify-between flex-wrap gap-4 border-b border-slate-700/60 pb-4">
              <div class="space-y-1">
                <div class="flex items-center space-x-3">
                  <span class="font-mono text-xs font-bold px-2 py-0.5 rounded bg-arr-blue/15 text-arr-accent border border-arr-blue/30" x-text="session.id"></span>
                  <h3 class="text-base font-bold text-white truncate max-w-lg" x-text="session.output_filename"></h3>
                </div>
                <p class="text-xs text-slate-400 font-mono" x-text="session.output_file"></p>
              </div>

              <div class="flex items-center space-x-3">
                <button @click="triggerFailover(session.id)" :disabled="!session.is_running" class="bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 px-3 py-1.5 rounded-lg text-xs font-medium transition disabled:opacity-50">
                  Force Failover
                </button>
                <button @click="stopSession(session.id)" :disabled="!session.is_running" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 px-3 py-1.5 rounded-lg text-xs font-medium transition disabled:opacity-50">
                  Stop Recording
                </button>
              </div>
            </div>

            <!-- Stats Bar -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 bg-slate-900/80 p-3.5 rounded-lg border border-slate-800">
              <div>
                <span class="text-xs text-slate-400 block font-medium uppercase tracking-wider">Status</span>
                <span class="text-sm font-bold capitalize flex items-center space-x-1.5" :class="session.is_running ? 'text-emerald-400' : 'text-slate-400'">
                  <span class="w-2 h-2 rounded-full" :class="session.is_running ? 'bg-emerald-400 animate-pulse' : 'bg-slate-500'"></span>
                  <span x-text="session.status"></span>
                </span>
              </div>
              <div>
                <span class="text-xs text-slate-400 block font-medium uppercase tracking-wider">Active Candidate</span>
                <span class="text-sm font-bold text-arr-accent" x-text="'Stream ' + session.current_candidate + ' of ' + session.total_candidates"></span>
              </div>
              <div>
                <span class="text-xs text-slate-400 block font-medium uppercase tracking-wider">Elapsed Time</span>
                <span class="text-sm font-bold font-mono text-slate-200" x-text="formatSeconds(session.elapsed_seconds)"></span>
              </div>
              <div>
                <span class="text-xs text-slate-400 block font-medium uppercase tracking-wider">Recorded Size</span>
                <span class="text-sm font-bold font-mono text-cyan-400" x-text="session.filesize_mb + ' MB'"></span>
              </div>
            </div>

            <!-- Candidate Stream Slots Badges -->
            <div class="flex items-center space-x-3 overflow-x-auto pb-1">
              <template x-for="(cand, idx) in session.candidates" :key="idx">
                <div class="px-3 py-1.5 rounded-lg text-xs flex items-center space-x-2 border shrink-0"
                     :class="(idx + 1) === session.current_candidate ? 'bg-arr-blue/20 text-arr-accent border-arr-blue/40 font-semibold' : 'bg-slate-900/60 text-slate-400 border-slate-800'">
                  <span class="w-2 h-2 rounded-full" :class="(idx + 1) === session.current_candidate ? 'bg-emerald-400 animate-ping' : 'bg-slate-600'"></span>
                  <span x-text="cand.name + ': ' + (cand.url.length > 40 ? cand.url.slice(0, 40) + '...' : cand.url)"></span>
                </div>
              </template>
            </div>

            <!-- Logs -->
            <div class="space-y-2">
              <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Event Log Stream</span>
              <div class="bg-black/90 rounded-lg p-3 font-mono text-xs text-slate-300 h-36 overflow-y-auto border border-slate-800 space-y-1">
                <template x-for="log in session.logs" :key="log">
                  <p class="leading-relaxed hover:bg-slate-900/50 px-1 rounded" x-text="log"></p>
                </template>
              </div>
            </div>

          </div>
        </template>
      </div>
    </div>

    <!-- TAB 2: Media Library -->
    <div x-show="activeTab === 'library'" class="space-y-4">
      <div class="arr-card rounded-xl overflow-hidden border border-slate-800">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-900/90 text-xs uppercase font-semibold text-slate-400 border-b border-slate-800">
            <tr>
              <th class="px-6 py-3.5">Filename</th>
              <th class="px-6 py-3.5">File Size</th>
              <th class="px-6 py-3.5">Recorded Date</th>
              <th class="px-6 py-3.5 text-right">Actions</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-800/80">
            <template x-if="libraryFiles.length === 0">
              <tr>
                <td colspan="4" class="px-6 py-8 text-center text-slate-500">No recorded media files found in library directory.</td>
              </tr>
            </template>

            <template x-for="item in libraryFiles" :key="item.filename">
              <tr class="hover:bg-slate-800/50 transition">
                <td class="px-6 py-3.5 font-mono font-medium text-white flex items-center space-x-2">
                  <svg class="w-4 h-4 text-arr-blue shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"></path></svg>
                  <span x-text="item.filename"></span>
                </td>
                <td class="px-6 py-3.5 font-mono text-cyan-400" x-text="item.size_mb + ' MB'"></td>
                <td class="px-6 py-3.5 text-slate-400" x-text="item.created_at"></td>
                <td class="px-6 py-3.5 text-right space-x-2">
                  <a :href="'/api/library/download/' + item.filename" download class="px-3 py-1 rounded bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200 inline-flex items-center space-x-1">
                    <span>Download</span>
                  </a>
                  <button @click="promptRename(item.filename)" class="px-3 py-1 rounded bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200">
                    Rename
                  </button>
                  <button @click="deleteFile(item.filename)" class="px-3 py-1 rounded bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 text-xs font-semibold">
                    Delete
                  </button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Modal: Create New Recording -->
  <div x-show="openNewModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm" style="display: none;">
    <div class="arr-card rounded-xl w-full max-w-2xl p-6 space-y-6 border border-slate-700 shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-800 pb-4">
        <h3 class="text-base font-bold text-white flex items-center space-x-2">
          <span class="w-3 h-3 rounded-full bg-arr-blue"></span>
          <span>Add PVArr Recording Session</span>
        </h3>
        <button @click="openNewModal = false" class="text-slate-400 hover:text-white">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <form @submit.prevent="submitRecording()" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Sport / Category</label>
            <input type="text" x-model="form.sport" required class="w-full px-3 py-2 rounded-lg text-sm arr-input text-white" placeholder="MLB / NFL / Sports">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Team A / Event</label>
            <input type="text" x-model="form.team_a" required class="w-full px-3 py-2 rounded-lg text-sm arr-input text-white" placeholder="Yankees">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Team B / Rival</label>
            <input type="text" x-model="form.team_b" required class="w-full px-3 py-2 rounded-lg text-sm arr-input text-white" placeholder="RedSox">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Resolution Tag</label>
            <select x-model="form.resolution" class="w-full px-3 py-2 rounded-lg text-sm arr-input text-white bg-slate-900">
              <option value="1080p">1080p Full HD</option>
              <option value="720p">720p HD</option>
              <option value="4K">4K Ultra HD</option>
              <option value="480p">480p SD</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Freeze Timeout (sec)</label>
            <input type="number" x-model="form.freeze_timeout" value="15" min="5" max="60" class="w-full px-3 py-2 rounded-lg text-sm arr-input text-white">
          </div>
        </div>

        <div class="space-y-3 pt-2">
          <label class="block text-xs font-bold text-arr-accent uppercase tracking-wider">Candidate Stream URLs (Up to 3)</label>
          <div>
            <span class="text-xs text-slate-400">Primary Stream URL (Required)</span>
            <input type="url" x-model="form.url_primary" required class="w-full px-3 py-2 rounded-lg text-sm arr-input font-mono text-emerald-400 mt-1" placeholder="https://stream-site.com/primary.m3u8">
          </div>
          <div>
            <span class="text-xs text-slate-400">Backup Candidate 1 URL</span>
            <input type="url" x-model="form.url_backup1" class="w-full px-3 py-2 rounded-lg text-sm arr-input font-mono text-amber-400 mt-1" placeholder="https://backup1-site.com/channel.php">
          </div>
          <div>
            <span class="text-xs text-slate-400">Backup Candidate 2 URL</span>
            <input type="url" x-model="form.url_backup2" class="w-full px-3 py-2 rounded-lg text-sm arr-input font-mono text-cyan-400 mt-1" placeholder="https://backup2-site.com/stream">
          </div>
        </div>

        <div class="pt-4 flex justify-end space-x-3 border-t border-slate-800">
          <button type="button" @click="openNewModal = false" class="px-4 py-2 rounded-lg text-sm text-slate-400 hover:text-white">Cancel</button>
          <button type="submit" class="bg-arr-blue hover:bg-blue-600 text-white px-5 py-2 rounded-lg text-sm font-semibold shadow-md shadow-arr-blue/20">
            Start Recording Session
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    function dashboardApp() {
      return {
        activeTab: 'active',
        openNewModal: false,
        activeSessions: [],
        libraryFiles: [],
        sseConnections: {},
        form: {
          sport: 'MLB',
          team_a: 'Yankees',
          team_b: 'RedSox',
          resolution: '1080p',
          freeze_timeout: 15,
          url_primary: '',
          url_backup1: '',
          url_backup2: ''
        },

        init() {
          this.refreshStatus();
          this.fetchLibrary();
          setInterval(() => { this.refreshStatus(); }, 3000);
        },

        formatSeconds(sec) {
          if (!sec) return '00:00:00';
          const s = Math.floor(sec % 60);
          const m = Math.floor((sec / 60) % 60);
          const h = Math.floor(sec / 3600);
          return [h, m, s].map(v => v < 10 ? '0' + v : v).join(':');
        },

        async refreshStatus() {
          try {
            const res = await fetch('/api/status');
            const data = await res.json();
            this.activeSessions = data.sessions || [];
            this.activeSessions.forEach(session => {
              if (session.is_running && !this.sseConnections[session.id]) {
                this.connectSSE(session.id);
              }
            });
          } catch (e) {
            console.error('Status check error:', e);
          }
        },

        connectSSE(sessionId) {
          const eventSource = new EventSource(`/api/recordings/${sessionId}/logs`);
          this.sseConnections[sessionId] = eventSource;

          eventSource.onmessage = (event) => {
            const data = JSON.parse(event.data);
            const session = this.activeSessions.find(s => s.id === sessionId);
            if (session) {
              if (data.summary) Object.assign(session, data.summary);
              if (data.log) {
                session.logs = session.logs || [];
                session.logs.push(data.log);
                if (session.logs.length > 200) session.logs.shift();
              }
            }
          };

          eventSource.onerror = () => {
            eventSource.close();
            delete this.sseConnections[sessionId];
          };
        },

        async fetchLibrary() {
          try {
            const res = await fetch('/api/library');
            const data = await res.json();
            this.libraryFiles = data.library || [];
          } catch (e) {
            console.error('Library error:', e);
          }
        },

        async submitRecording() {
          const formData = new FormData();
          Object.keys(this.form).forEach(k => formData.append(k, this.form[k]));

          try {
            const res = await fetch('/api/recordings/start', { method: 'POST', body: formData });
            const data = await res.json();
            if (res.ok) {
              this.openNewModal = false;
              this.refreshStatus();
              this.form.url_primary = '';
              this.form.url_backup1 = '';
              this.form.url_backup2 = '';
            } else {
              alert(data.detail || 'Failed to start recording');
            }
          } catch (e) {
            alert('Error submitting recording: ' + e);
          }
        },

        async triggerFailover(id) {
          if (!confirm('Force failover to next candidate stream?')) return;
          try {
            await fetch(`/api/recordings/${id}/failover`, { method: 'POST' });
            this.refreshStatus();
          } catch (e) {
            alert('Failover error: ' + e);
          }
        },

        async stopSession(id) {
          if (!confirm('Stop recording session?')) return;
          try {
            await fetch(`/api/recordings/${id}/stop`, { method: 'POST' });
            this.refreshStatus();
            setTimeout(() => this.fetchLibrary(), 1500);
          } catch (e) {
            alert('Stop error: ' + e);
          }
        },

        async promptRename(oldName) {
          const newName = prompt('Enter new filename for recording:', oldName);
          if (!newName || newName === oldName) return;

          const formData = new FormData();
          formData.append('old_name', oldName);
          formData.append('new_name', newName);

          try {
            const res = await fetch('/api/library/rename', { method: 'POST', body: formData });
            if (res.ok) this.fetchLibrary();
            else alert('Failed to rename file.');
          } catch (e) {
            alert('Rename error: ' + e);
          }
        },

        async deleteFile(filename) {
          if (!confirm(`Delete ${filename}?`)) return;
          try {
            const res = await fetch(`/api/library/${filename}`, { method: 'DELETE' });
            if (res.ok) this.fetchLibrary();
            else alert('Delete failed.');
          } catch (e) {
            alert('Delete error: ' + e);
          }
        }
      };
    }
  </script>
</body>
</html>
