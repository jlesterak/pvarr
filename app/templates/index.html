<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PVArr - Personal Video Recorder</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.ico">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            arr: {
              blue: '#0084ff',
              dark: '#1e293b',
              sidebar: '#0f172a',
              card: '#1e293b',
              accent: '#38bdf8',
            }
          }
        }
      }
    }
  </script>

  <!-- Alpine.js CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    body {
      background-color: #0b1120;
      color: #f1f5f9;
    }
    .arr-navbar {
      background: #0f172a;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .arr-card {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .arr-input {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .arr-input:focus {
      border-color: #0084ff;
      outline: none;
      box-shadow: 0 0 10px rgba(0, 132, 255, 0.3);
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
  </style>
</head>
<body class="font-sans min-h-screen flex flex-col text-slate-100" x-data="dashboardApp()">

  <!-- Top *Arr Header Bar -->
  <header class="arr-navbar sticky top-0 z-40 px-6 py-3 shadow-md">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-4">
        <!-- Logo -->
        <div class="w-9 h-9 rounded-lg bg-arr-blue flex items-center justify-center font-black text-xl text-white shadow-lg shadow-arr-blue/30">
          P
        </div>
        <div class="flex items-baseline space-x-2">
          <span class="text-xl font-bold tracking-tight text-white">PV<span class="text-arr-accent">Arr</span></span>
          <span class="text-xs font-semibold px-2 py-0.5 rounded bg-arr-blue/20 text-arr-accent border border-arr-blue/30">v{{ pvarr_version }}</span>
        </div>
      </div>

      <!-- Header Action Buttons -->
      <div class="flex items-center space-x-4">
        <div class="px-3 py-1 rounded-md text-xs font-medium flex items-center space-x-2 bg-slate-800 border border-slate-700">
          <span class="w-2 h-2 rounded-full" :class="liveSessions.length > 0 ? 'bg-emerald-400 animate-pulse' : 'bg-slate-500'"></span>
          <span x-text="liveSessions.length > 0 ? liveSessions.length + ' Active Stream(s)' : 'System Idle'"></span>
        </div>

        <button @click="openNewModal = true" class="bg-arr-blue hover:bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-md shadow-arr-blue/20 transition flex items-center space-x-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          <span>Add Recording</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Sub-header Navigation Tabs -->
  <div class="bg-slate-900/80 border-b border-slate-800 px-6 py-2">
    <div class="max-w-7xl mx-auto flex space-x-6 text-sm font-medium text-slate-400">
      <button @click="activeTab = 'active'" :class="activeTab === 'active' ? 'text-arr-accent border-b-2 border-arr-blue pb-1 font-semibold' : 'hover:text-slate-200 pb-1'">
        Live Recorders (<span x-text="liveSessions.length"></span>)
      </button>
      <button @click="activeTab = 'library'" :class="activeTab === 'library' ? 'text-arr-accent border-b-2 border-arr-blue pb-1 font-semibold' : 'hover:text-slate-200 pb-1'">
        Media Library (<span x-text="libraryFiles.length"></span>)
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-6 py-6 flex-1 w-full space-y-6">

    <!-- TAB 1: Active Recorders -->
    <div x-show="activeTab === 'active'" class="space-y-6">
      <template x-if="activeSessions.length === 0">
        <div class="arr-card rounded-xl p-12 text-center space-y-4">
          <div class="w-12 h-12 rounded-full bg-slate-800 text-slate-400 mx-auto flex items-center justify-center">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
          </div>
          <h3 class="text-base font-semibold text-slate-200">No active stream recordings</h3>
          <p class="text-slate-400 text-xs">Add a new stream candidate URL to begin recording with automatic failover protection.</p>
          <button @click="openNewModal = true" class="text-arr-accent hover:underline text-xs font-semibold">Start a new recording &rarr;</button>
        </div>
      </template>

      <div class="grid grid-cols-1 gap-6">
        <template x-for="session in liveSessions" :key="session.id">
          <div class="arr-card rounded-xl p-6 space-y-5 border border-slate-700/60 shadow-lg">
            
            <div class="flex items-start justify-between flex-wrap gap-4 border-b border-slate-700/60 pb-4">
              <div class="space-y-1">
                <div class="flex items-center space-x-3">
                  <span class="font-mono text-xs font-bold px-2 py-0.5 rounded bg-arr-blue/15 text-arr-accent border border-arr-blue/30" x-text="session.id"></span>
                  <div class="flex items-center space-x-2 min-w-0">
                    <h3 class="text-base font-bold text-white truncate max-w-lg"
                        x-text="session.is_rebroadcast ? session.channel_name : session.output_filename"></h3>
                    <!-- Say plainly that nothing is being kept, so a channel is
                         never mistaken for a recording that has gone missing. -->
                    <span x-show="session.is_rebroadcast"
                          class="shrink-0 px-2 py-0.5 rounded-md text-[10px] font-semibold uppercase tracking-wider bg-sky-500/10 text-sky-400 border border-sky-500/30"
                          title="Streaming to your media server only — not saved to disk">Rebroadcast</span>
                  </div>
                </div>
                <p class="text-xs text-slate-400 font-mono" x-text="session.output_file"></p>
              </div>

              <div class="flex items-center space-x-3">
                <button @click="triggerFailover(session.id)" :disabled="!session.is_running || session.current_candidate >= session.total_candidates" :title="session.current_candidate >= session.total_candidates ? 'No backup stream configured for this session' : 'Switch to the next candidate stream'" class="bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 px-3 py-1.5 rounded-lg text-xs font-medium transition disabled:opacity-50">
                  Force Failover
                </button>
                <button @click="stopSession(session.id)" :disabled="!session.is_running" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 px-3 py-1.5 rounded-lg text-xs font-medium transition disabled:opacity-50">
                  Stop Recording
                </button>
              </div>
            </div>

            <!-- Stats Bar -->
            <div class="grid grid-cols-2 sm:grid-cols-5 gap-4 bg-slate-900/80 p-3.5 rounded-lg border border-slate-800">
              <div>
                <span class="text-xs text-slate-400 block font-medium uppercase tracking-wider">Status</span>
                <span class="text-sm font-bold capitalize flex items-center space-x-1.5" :class="statusTextClass(session)">
                  <span class="w-2 h-2 rounded-full" :class="statusDotClass(session)"></span>
                  <span x-text="prettyStatus(session.status)"></span>
                </span>
              </div>
              <div>
                <span class="text-xs text-slate-400 block font-medium uppercase tracking-wider">Active Candidate</span>
                <span class="text-sm font-bold text-arr-accent" x-text="'Stream ' + session.current_candidate + ' of ' + session.total_candidates"></span>
              </div>
              <div>
                <span class="text-xs text-slate-400 block font-medium uppercase tracking-wider">Elapsed Time</span>
                <span class="text-sm font-bold font-mono text-slate-200" x-text="formatSeconds(session.elapsed_seconds)"></span>
              </div>
              <div>
                <span class="text-xs text-slate-400 block font-medium uppercase tracking-wider">On Disk</span>
                <span class="text-sm font-bold font-mono" :class="sizeDisagrees(session) ? 'text-amber-400' : 'text-cyan-400'"
                      :title="sizeDisagrees(session)
                                ? 'Data is arriving but the file on disk is not growing. Something may have removed it.'
                                : 'Size of the file on disk'"
                      x-text="session.filesize_mb + ' MB'"></span>
              </div>
              <!-- Captured is the recorder's own counter. It and On Disk must
                   agree; when they do not, bytes are going somewhere the file
                   is not, which is exactly how a deleted-out-from-under
                   recording looked while it silently lost four minutes. -->
              <div>
                <span class="text-xs text-slate-400 block font-medium uppercase tracking-wider">Captured</span>
                <span class="text-sm font-bold font-mono text-slate-200"
                      title="Bytes the recorder has received from the stream"
                      x-text="toMB(session.bytes_written) + ' MB'"></span>
              </div>
            </div>

            <!-- Candidate Stream Slots Badges -->
            <div class="flex items-center space-x-3 overflow-x-auto pb-1">
              <template x-for="(cand, idx) in session.candidates" :key="idx">
                <!-- Clickable: this is the only route back to an earlier
                     candidate, since failover only ever moves forwards. -->
                <button type="button"
                     @click="switchCandidate(session.id, idx + 1)"
                     :disabled="!session.is_running || (idx + 1) === session.current_candidate"
                     class="px-3 py-1.5 rounded-lg text-xs flex items-center space-x-2 border shrink-0 transition enabled:hover:border-arr-blue/60 enabled:cursor-pointer disabled:cursor-default"
                     :title="(idx + 1) === session.current_candidate
                               ? 'Currently recording this stream'
                               : (session.is_running ? 'Switch to ' + cand.name : '')
                             + (cand.detect_note ? ' — ' + cand.detect_note : '')
                             + (cand.referer ? ' Referer: ' + cand.referer : '')"
                     :class="(idx + 1) === session.current_candidate ? 'bg-arr-blue/20 text-arr-accent border-arr-blue/40 font-semibold' : 'bg-slate-900/60 text-slate-400 border-slate-800'">
                  <span class="w-2 h-2 rounded-full" :class="(idx + 1) === session.current_candidate ? 'bg-emerald-400 animate-ping' : 'bg-slate-600'"></span>
                  <span x-text="cand.name + ': ' + (cand.url.length > 40 ? cand.url.slice(0, 40) + '...' : cand.url)"></span>
                  <span x-show="cand.fail_count > 0" class="text-amber-500/80"
                        x-text="'⚠ ' + cand.fail_count"></span>
                </button>
              </template>
            </div>

            <!-- Logs -->
            <div class="space-y-2">
              <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Event Log Stream</span>
              <div class="bg-black/90 rounded-lg p-3 font-mono text-xs text-slate-300 h-36 overflow-y-auto border border-slate-800 space-y-1">
                <template x-for="log in session.logs" :key="log">
                  <p class="leading-relaxed hover:bg-slate-900/50 px-1 rounded" x-text="log"></p>
                </template>
              </div>
            </div>

          </div>
        </template>
      </div>

      <!-- Recently finished ------------------------------------------------
           Collapsed rather than removed. A finished session still holds its
           log history, and that history is the most useful thing in the app
           in the minutes right after a recording ends -- it is what diagnosed
           the delete-while-recording bug. Throwing it away to tidy the page
           would have thrown away the evidence. -->
      <template x-if="finishedSessions.length > 0">
        <div class="space-y-2 pt-2">
          <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">
            Recently Finished (<span x-text="finishedSessions.length"></span>)
          </span>
          <div class="space-y-2">
            <template x-for="session in finishedSessions" :key="session.id">
              <div class="arr-card rounded-lg border border-slate-800/80 overflow-hidden">
                <button type="button" @click="toggleFinished(session.id)"
                        class="w-full flex items-center gap-3 px-4 py-2.5 text-left hover:bg-slate-800/40 transition">
                  <span class="w-2 h-2 rounded-full shrink-0" :class="statusDotClass(session)"></span>
                  <span class="text-sm text-slate-300 truncate flex-1 min-w-0"
                        x-text="session.is_rebroadcast ? session.channel_name : session.output_filename"></span>
                  <span class="text-xs font-mono text-slate-500 shrink-0 hidden sm:inline"
                        x-text="formatSeconds(session.elapsed_seconds)"></span>
                  <span class="text-xs font-mono text-cyan-400/70 shrink-0"
                        x-show="!session.is_rebroadcast" x-text="session.filesize_mb + ' MB'"></span>
                  <span class="text-xs capitalize shrink-0" :class="statusTextClass(session)"
                        x-text="prettyStatus(session.status)"></span>
                  <span class="text-slate-500 shrink-0 text-[10px]"
                        x-text="expandedFinished[session.id] ? '\u25B2' : '\u25BC'"></span>
                </button>
                <div x-show="expandedFinished[session.id]" x-cloak class="px-4 pb-3 space-y-2 border-t border-slate-800/80 pt-3">
                  <p class="text-xs text-slate-500 font-mono truncate" x-text="session.output_file"></p>
                  <div class="bg-black/90 rounded-lg p-3 font-mono text-xs text-slate-300 h-36 overflow-y-auto border border-slate-800 space-y-1">
                    <template x-for="log in session.logs" :key="log">
                      <p class="leading-relaxed hover:bg-slate-900/50 px-1 rounded" x-text="log"></p>
                    </template>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>

    <!-- TAB 2: Media Library -->
    <div x-show="activeTab === 'library'" class="space-y-4">
      <div class="arr-card rounded-xl overflow-hidden border border-slate-800">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-900/90 text-xs uppercase font-semibold text-slate-400 border-b border-slate-800">
            <tr>
              <th class="px-6 py-3.5">Filename</th>
              <th class="px-6 py-3.5">File Size</th>
              <th class="px-6 py-3.5">Recorded Date</th>
              <th class="px-6 py-3.5 text-right">Actions</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-800/80">
            <template x-if="libraryFiles.length === 0">
              <tr>
                <td colspan="4" class="px-6 py-8 text-center text-slate-500">No recorded media files found in library directory.</td>
              </tr>
            </template>

            <template x-for="item in libraryFiles" :key="item.filename">
              <tr class="hover:bg-slate-800/50 transition">
                <td class="px-6 py-3.5 font-mono font-medium text-white flex items-center space-x-2">
                  <svg class="w-4 h-4 text-arr-blue shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"></path></svg>
                  <span x-text="item.filename"></span>
                </td>
                <td class="px-6 py-3.5 font-mono text-cyan-400" x-text="item.size_mb + ' MB'"></td>
                <td class="px-6 py-3.5 text-slate-400" x-text="item.created_at"></td>
                <td class="px-6 py-3.5 text-right space-x-2">
                  <a :href="'/api/library/download/' + item.filename" download class="px-3 py-1 rounded bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200 inline-flex items-center space-x-1">
                    <span>Download</span>
                  </a>
                  <button @click="promptRename(item.filename)" class="px-3 py-1 rounded bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200">
                    Rename
                  </button>
                  <button @click="deleteFile(item.filename)" class="px-3 py-1 rounded bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 text-xs font-semibold">
                    Delete
                  </button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Modal: Create New Recording -->
  <div x-show="openNewModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm" style="display: none;">
    <div class="arr-card rounded-xl w-full max-w-2xl p-6 space-y-6 border border-slate-700 shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-800 pb-4">
        <h3 class="text-base font-bold text-white flex items-center space-x-2">
          <span class="w-3 h-3 rounded-full bg-arr-blue"></span>
          <span>Add PVArr Recording Session</span>
        </h3>
        <button @click="openNewModal = false" class="text-slate-400 hover:text-white">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <form @submit.prevent="submitRecording()" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Sport / Category</label>
            <input type="text" x-model="form.sport" required class="w-full px-3 py-2 rounded-lg text-sm arr-input text-white" placeholder="MLB / NFL / Sports">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Team A / Event</label>
            <input type="text" x-model="form.team_a" required class="w-full px-3 py-2 rounded-lg text-sm arr-input text-white" placeholder="Yankees">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Team B / Rival</label>
            <input type="text" x-model="form.team_b" required class="w-full px-3 py-2 rounded-lg text-sm arr-input text-white" placeholder="RedSox">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Resolution Tag</label>
            <select x-model="form.resolution" class="w-full px-3 py-2 rounded-lg text-sm arr-input text-white bg-slate-900">
              <option value="1080p">1080p Full HD</option>
              <option value="720p">720p HD</option>
              <option value="4K">4K Ultra HD</option>
              <option value="480p">480p SD</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Freeze Timeout (sec)</label>
            <input type="number" x-model="form.freeze_timeout" value="15" min="5" max="60" class="w-full px-3 py-2 rounded-lg text-sm arr-input text-white">
          </div>
        </div>

        <!-- Rebroadcast: capture and serve to Plex without keeping anything.
             Failover still applies; only the destination changes. -->
        <div class="pt-2">
          <label class="flex items-start space-x-3 cursor-pointer group">
            <input type="checkbox" x-model="form.rebroadcast"
                   class="mt-0.5 w-4 h-4 rounded border-slate-700 bg-slate-900 text-arr-blue focus:ring-arr-blue/40 cursor-pointer">
            <span class="text-sm">
              <span class="text-slate-200 group-hover:text-white transition">Rebroadcast only — don't save to disk</span>
              <span class="block text-[11px] text-slate-500 mt-0.5">
                Serve this as a live channel to Plex/Emby/Jellyfin without recording it.
                Failover still works. Nothing is written to your library.
              </span>
            </span>
          </label>
          <div x-show="form.rebroadcast" x-transition class="mt-3">
            <label class="block text-xs font-medium text-slate-400 mb-1">Channel Name (optional)</label>
            <input type="text" x-model="form.channel_name"
                   placeholder="Defaults to the team names above"
                   class="w-full px-3 py-2 rounded-lg text-sm arr-input text-white">
          </div>
        </div>

        <div class="space-y-3 pt-2">
          <div class="flex items-baseline justify-between">
            <label class="block text-xs font-bold text-arr-accent uppercase tracking-wider">Candidate Stream URLs (Up to 3)</label>
            <span class="text-[11px] text-slate-500">Paste an m3u8 or the page that plays it — PVArr works out the headers.</span>
          </div>

          <template x-for="slot in slots" :key="slot.key">
            <div class="space-y-1">
              <span class="text-xs text-slate-400" x-text="slot.label"></span>
              <input type="url" :required="slot.required" x-model="form[slot.key]"
                     @input.debounce.700ms="probeSlot(slot.key)" @change="probeSlot(slot.key)"
                     class="w-full px-3 py-2 rounded-lg text-sm arr-input font-mono mt-1"
                     :class="slot.tone" :placeholder="slot.placeholder">

              <!-- Probe verdict -->
              <template x-if="probes[slot.key] && probes[slot.key].state !== 'idle'">
                <div class="text-xs flex items-start space-x-2 px-1"
                     :class="{ 'text-slate-400': probes[slot.key].state === 'probing',
                               'text-emerald-400': probes[slot.key].state === 'ok',
                               'text-rose-400': probes[slot.key].state === 'fail' }">
                  <span x-show="probes[slot.key].state === 'probing'" class="animate-pulse">◌</span>
                  <span x-show="probes[slot.key].state === 'ok'">✓</span>
                  <span x-show="probes[slot.key].state === 'fail'">✕</span>
                  <div class="space-y-0.5 min-w-0">
                    <p x-text="probes[slot.key].message"></p>
                    <p x-show="probes[slot.key].resolved" class="font-mono text-[11px] text-slate-500 truncate"
                       x-text="'→ ' + probes[slot.key].resolved"></p>
                  </div>
                </div>
              </template>

              <div class="px-1">
                <button type="button" @click="toggleAdvanced(slot.key)"
                        class="text-[11px] text-slate-500 hover:text-arr-accent">
                  <span x-text="advanced[slot.key] ? 'Hide headers' : 'Set headers manually'"></span>
                </button>
              </div>

              <!-- Manual override: only needed when the probe cannot guess -->
              <div x-show="advanced[slot.key]" class="grid grid-cols-1 sm:grid-cols-3 gap-2 pt-1" style="display:none;">
                <input type="text" x-model="overrides[slot.key].referer" placeholder="Referer"
                       class="px-2 py-1.5 rounded text-xs arr-input font-mono text-slate-200">
                <input type="text" x-model="overrides[slot.key].user_agent" placeholder="User-Agent"
                       class="px-2 py-1.5 rounded text-xs arr-input font-mono text-slate-200">
                <input type="text" x-model="overrides[slot.key].cookie" placeholder="Cookie"
                       class="px-2 py-1.5 rounded text-xs arr-input font-mono text-slate-200">
              </div>
            </div>
          </template>
        </div>

        <div class="pt-4 flex justify-end space-x-3 border-t border-slate-800">
          <button type="button" @click="openNewModal = false" class="px-4 py-2 rounded-lg text-sm text-slate-400 hover:text-white">Cancel</button>
          <button type="submit" class="bg-arr-blue hover:bg-blue-600 text-white px-5 py-2 rounded-lg text-sm font-semibold shadow-md shadow-arr-blue/20">
            Start Recording Session
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    function dashboardApp() {
      return {
        activeTab: 'active',
        openNewModal: false,
        activeSessions: [],
        expandedFinished: {},
        libraryFiles: [],
        sseConnections: {},
        form: {
          sport: 'MLB',
          team_a: 'Yankees',
          team_b: 'RedSox',
          resolution: '1080p',
          freeze_timeout: 15,
          rebroadcast: false,
          channel_name: '',
          url_primary: '',
          url_backup1: '',
          url_backup2: ''
        },
        slots: [
          { key: 'url_primary', label: 'Primary Stream URL (Required)', required: true,
            tone: 'text-emerald-400', placeholder: 'https://cdn.example.com/hls/stream.m3u8?token=...' },
          { key: 'url_backup1', label: 'Backup Candidate 1 URL', required: false,
            tone: 'text-amber-400', placeholder: 'https://backup1-site.com/channel.php' },
          { key: 'url_backup2', label: 'Backup Candidate 2 URL', required: false,
            tone: 'text-cyan-400', placeholder: 'https://backup2-site.com/stream' }
        ],
        probes: { url_primary: null, url_backup1: null, url_backup2: null },
        advanced: { url_primary: false, url_backup1: false, url_backup2: false },
        overrides: {
          url_primary: { referer: '', user_agent: '', cookie: '' },
          url_backup1: { referer: '', user_agent: '', cookie: '' },
          url_backup2: { referer: '', user_agent: '', cookie: '' }
        },
        probeSeq: { url_primary: 0, url_backup1: 0, url_backup2: 0 },

        init() {
          this.refreshStatus();
          this.fetchLibrary();
          setInterval(() => { this.refreshStatus(); }, 3000);
        },

        // A session is "live" while its thread is still working -- which
        // includes post-processing, not just capture. Splitting on is_running
        // keeps a finished recording from sitting at the top of the page
        // pretending to be active.
        get liveSessions() {
          return this.activeSessions.filter(s => s.is_running);
        },
        get finishedSessions() {
          return this.activeSessions.filter(s => !s.is_running);
        },

        toggleFinished(id) {
          this.expandedFinished[id] = !this.expandedFinished[id];
        },

        prettyStatus(status) {
          return (status || '').replace(/_/g, ' ');
        },

        toMB(bytes) {
          return ((bytes || 0) / 1048576).toFixed(2);
        },

        // Amber, not green: the thread is still busy but nothing is being
        // captured any more, and the file is not in the library yet.
        statusDotClass(s) {
          if (!s.is_running) {
            if (['failed', 'aborted_no_space', 'aborted_output_lost'].includes(s.status)) return 'bg-rose-500';
            if (['completed_partial', 'interrupted'].includes(s.status)) return 'bg-amber-500';
            return 'bg-slate-500';
          }
          return s.status === 'post_processing'
            ? 'bg-amber-400 animate-pulse'
            : 'bg-emerald-400 animate-pulse';
        },

        statusTextClass(s) {
          if (!s.is_running) {
            if (['failed', 'aborted_no_space', 'aborted_output_lost'].includes(s.status)) return 'text-rose-400';
            if (['completed_partial', 'interrupted'].includes(s.status)) return 'text-amber-400';
            return 'text-slate-400';
          }
          return s.status === 'post_processing' ? 'text-amber-400' : 'text-emerald-400';
        },

        // The recorder has received data but the file on disk is not growing.
        // That combination is what a recording being deleted underneath looks
        // like, and it was invisible until both numbers were on screen.
        sizeDisagrees(s) {
          // Only while actually capturing. During post_processing the remux
          // has already deleted the .ts, so on-disk is legitimately 0 against
          // a large captured count -- warning there would cry wolf on every
          // single successful recording.
          if (s.is_rebroadcast || s.status !== 'recording') return false;
          return (s.bytes_written || 0) > 1048576 && (s.filesize_mb || 0) === 0;
        },

        formatSeconds(sec) {
          if (!sec) return '00:00:00';
          const s = Math.floor(sec % 60);
          const m = Math.floor((sec / 60) % 60);
          const h = Math.floor(sec / 3600);
          return [h, m, s].map(v => v < 10 ? '0' + v : v).join(':');
        },

        async refreshStatus() {
          try {
            const res = await fetch('/api/status');
            const data = await res.json();
            this.activeSessions = data.sessions || [];
            this.activeSessions.forEach(session => {
              if (session.is_running && !this.sseConnections[session.id]) {
                this.connectSSE(session.id);
              }
            });
          } catch (e) {
            console.error('Status check error:', e);
          }
        },

        connectSSE(sessionId) {
          const eventSource = new EventSource(`/api/recordings/${sessionId}/logs`);
          this.sseConnections[sessionId] = eventSource;

          eventSource.onmessage = (event) => {
            const data = JSON.parse(event.data);
            const session = this.activeSessions.find(s => s.id === sessionId);
            if (session) {
              if (data.summary) Object.assign(session, data.summary);
              if (data.log) {
                session.logs = session.logs || [];
                session.logs.push(data.log);
                if (session.logs.length > 200) session.logs.shift();
              }
            }
          };

          eventSource.onerror = () => {
            eventSource.close();
            delete this.sseConnections[sessionId];
          };
        },

        async fetchLibrary() {
          try {
            const res = await fetch('/api/library');
            const data = await res.json();
            this.libraryFiles = data.library || [];
          } catch (e) {
            console.error('Library error:', e);
          }
        },

        toggleAdvanced(key) {
          this.advanced[key] = !this.advanced[key];
        },

        async probeSlot(key) {
          const url = (this.form[key] || '').trim();
          if (!url) { this.probes[key] = null; return; }
          if (!/^https?:\/\//i.test(url)) {
            this.probes[key] = { state: 'fail', message: 'URL must start with http:// or https://' };
            return;
          }

          // Each keystroke can fire a probe; only the newest answer may win, or
          // a slow early request would overwrite a later, correct one.
          const seq = ++this.probeSeq[key];
          this.probes[key] = { state: 'probing', message: 'Checking stream and working out headers...' };

          const body = new FormData();
          body.append('url', url);
          if (this.overrides[key].referer) body.append('referer', this.overrides[key].referer);

          try {
            const res = await fetch('/api/probe', { method: 'POST', body });
            const data = await res.json();
            if (seq !== this.probeSeq[key]) return;

            if (data.ok) {
              this.probes[key] = {
                state: 'ok',
                message: data.message,
                resolved: data.m3u8_url !== url ? data.m3u8_url : '',
                data: data
              };
              // Show what was detected so it can be edited rather than retyped.
              this.overrides[key].referer = data.referer || '';
              this.overrides[key].cookie = data.cookie || '';
            } else {
              this.probes[key] = { state: 'fail', message: data.message || 'Could not verify this stream.', data: null };
              this.advanced[key] = true;
            }
          } catch (e) {
            if (seq !== this.probeSeq[key]) return;
            this.probes[key] = { state: 'fail', message: 'Probe request failed: ' + e };
          }
        },

        buildStreamHeaders() {
          // Keyed by URL, not slot position: an empty backup slot must not
          // shift headers onto the wrong candidate server-side.
          const headers = {};
          this.slots.forEach(slot => {
            const url = (this.form[slot.key] || '').trim();
            if (!url) return;
            const o = this.overrides[slot.key];
            const entry = {};
            if (o.referer) entry.referer = o.referer;
            if (o.user_agent) entry.user_agent = o.user_agent;
            if (o.cookie) entry.cookie = o.cookie;
            if (Object.keys(entry).length) headers[url] = entry;
          });
          return headers;
        },

        resetStreamForm() {
          this.slots.forEach(slot => {
            this.form[slot.key] = '';
            this.probes[slot.key] = null;
            this.advanced[slot.key] = false;
            this.overrides[slot.key] = { referer: '', user_agent: '', cookie: '' };
          });
        },

        async submitRecording() {
          const primary = this.probes.url_primary;
          if (primary && primary.state === 'fail') {
            if (!confirm('PVArr could not verify the primary stream:\n\n' + primary.message +
                         '\n\nStart the recording anyway?')) return;
          }

          const formData = new FormData();
          Object.keys(this.form).forEach(k => formData.append(k, this.form[k]));
          const headers = this.buildStreamHeaders();
          if (Object.keys(headers).length) {
            formData.append('stream_headers', JSON.stringify(headers));
          }

          try {
            const res = await fetch('/api/recordings/start', { method: 'POST', body: formData });
            const data = await res.json();
            if (res.ok) {
              this.openNewModal = false;
              this.refreshStatus();
              this.resetStreamForm();
            } else {
              alert(data.detail || 'Failed to start recording');
            }
          } catch (e) {
            alert('Error submitting recording: ' + e);
          }
        },

        async triggerFailover(id) {
          if (!confirm('Force failover to next candidate stream?')) return;
          try {
            const res = await fetch(`/api/recordings/${id}/failover`, { method: 'POST' });
            if (!res.ok) {
              const err = await res.json().catch(() => ({}));
              alert('Failover refused: ' + (err.detail || ('HTTP ' + res.status)));
              return;
            }
            // The recorder thread reacts a moment after the POST returns, so a
            // single immediate refresh still paints the old candidate and the
            // button looks dead. Re-poll over the next few seconds instead of
            // waiting for the 3s timer to come round.
            this.refreshStatus();
            [500, 1500, 3000].forEach(ms => setTimeout(() => this.refreshStatus(), ms));
          } catch (e) {
            alert('Failover error: ' + e);
          }
        },

        async switchCandidate(id, candidate) {
          try {
            const body = new URLSearchParams({ candidate: candidate });
            const res = await fetch(`/api/recordings/${id}/switch`, { method: 'POST', body });
            if (!res.ok) {
              const err = await res.json().catch(() => ({}));
              alert('Switch refused: ' + (err.detail || ('HTTP ' + res.status)));
              return;
            }
            // Same reason as triggerFailover: the recorder thread reacts a
            // moment after the POST returns, so one immediate refresh would
            // still paint the candidate we just left.
            this.refreshStatus();
            [500, 1500, 3000].forEach(ms => setTimeout(() => this.refreshStatus(), ms));
          } catch (e) {
            alert('Switch error: ' + e);
          }
        },

        async stopSession(id) {
          if (!confirm('Stop recording session?')) return;
          try {
            await fetch(`/api/recordings/${id}/stop`, { method: 'POST' });
            this.refreshStatus();
            // Post-processing runs after the stop returns, and a remux of a
            // long recording takes far longer than a second or two. A single
            // refresh here listed the .ts that the remux was about to delete,
            // so the next click on it 404'd. Keep checking back.
            [1500, 5000, 15000, 30000].forEach(ms => setTimeout(() => {
              this.fetchLibrary();
              this.refreshStatus();
            }, ms));
          } catch (e) {
            alert('Stop error: ' + e);
          }
        },

        async promptRename(oldName) {
          const newName = prompt('Enter new filename for recording:', oldName);
          if (!newName || newName === oldName) return;

          const formData = new FormData();
          formData.append('old_name', oldName);
          formData.append('new_name', newName);

          try {
            const res = await fetch('/api/library/rename', { method: 'POST', body: formData });
            if (res.ok) this.fetchLibrary();
            else alert('Failed to rename file.');
          } catch (e) {
            alert('Rename error: ' + e);
          }
        },

        async deleteFile(filename) {
          if (!confirm(`Delete ${filename}?`)) return;
          try {
            const res = await fetch(`/api/library/${filename}`, { method: 'DELETE' });
            if (res.ok) this.fetchLibrary();
            else alert('Delete failed.');
          } catch (e) {
            alert('Delete error: ' + e);
          }
        }
      };
    }
  </script>
</body>
</html>
