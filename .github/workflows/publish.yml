name: publish

# Publishes the container image to ghcr.io/jlesterak/pvarr.
#
# Tag policy is split so this workflow and scripts/publish.sh never fight over
# an immutable tag:
#   - a green `tests` run on main  -> :latest and :sha-<short>  (moving tags)
#   - a pushed version tag (v1.2.3) -> :1.2.3 as well           (immutable)
# scripts/publish.sh is what mints a version tag locally; CI only mirrors it
# when you push the matching git tag.
on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    # Skip when the upstream test run failed. Tag pushes and manual dispatch
    # carry no workflow_run payload, so they fall through the first clause.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the commit that was tested
        uses: actions/checkout@v4
        with:
          # For workflow_run the default ref is the branch head, which may have
          # moved past the commit that actually passed tests. Pin to that sha.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Derive image tags
        id: tags
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository }}"
          image="${image,,}"   # GHCR rejects uppercase in the image path

          sha=$(git rev-parse --short HEAD)
          tags="${image}:latest"$'\n'"${image}:sha-${sha}"

          # On a version tag, also publish the immutable version tag and check
          # it against app/__init__.py so the two can't drift apart.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            git_version="${GITHUB_REF_NAME#v}"
            file_version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app/__init__.py)
            if [ "$git_version" != "$file_version" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match __version__=${file_version} in app/__init__.py"
              exit 1
            fi
            tags="${tags}"$'\n'"${image}:${git_version}"
          fi

          {
            echo "image=${image}"
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Publishing:"; echo "${tags}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # Reuse layers between runs so ffmpeg/pip aren't reinstalled each time.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        run: |
          {
            echo "### Published \`${{ steps.tags.outputs.image }}\`"
            echo ""
            echo "From commit \`${{ github.event.workflow_run.head_sha || github.sha }}\`."
            echo ""
            echo '```'
            echo "${{ steps.tags.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
